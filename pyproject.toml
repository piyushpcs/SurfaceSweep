[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacesweep"
version = "1.0.3"
description = "JavaScript attack-surface recon for security assessment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "piyushpcs" }]
keywords = ["security", "recon", "javascript", "endpoints", "assessment"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "beautifulsoup4==4.15.0",
    "playwright==1.63.0",
    "requests==2.34.2",
    "tldextract==5.3.2",
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
]

[project.urls]
Homepage = "https://github.com/piyushpcs/SurfaceSweep"
Repository = "https://github.com/piyushpcs/SurfaceSweep"
Issues = "https://github.com/piyushpcs/SurfaceSweep/issues"

[project.scripts]
surfacesweep = "main:main"
surfacesweep-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = ["coverage>=7.0"]

[tool.setuptools]
py-modules = ["main", "mcp_server"]

[tool.setuptools.packages.find]
include = ["modules*"]
exclude = ["tests*", "reports*", "testbed*", "venv*"]
